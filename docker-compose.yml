version: '3.8'

services:
  api:
    image: weblog-core:latest
    container_name: weblog-api
    restart: always
    ports:
      - "127.0.0.1:5100:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - weblog-net

  web:
    image: weblog-vue3:latest
    container_name: weblog-web
    restart: always
    ports:
      - "127.0.0.1:5101:80"
    depends_on:
      - api
    networks:
      - weblog-net

networks:
  weblog-net:
    driver: bridge
