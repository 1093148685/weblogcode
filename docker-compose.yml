version: '3.8'

services:
  api:
    image: weblog-core:latest
    container_name: weblog-api
    restart: always
    ports:
      - "5000:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    network_mode: bridge
